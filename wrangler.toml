name = "elder-realms-game"
main = "workers/index.ts"
compatibility_date = "2026-10-20"
compatibility_flags = ["nodejs_compat"]

[vars]
# Set this to the Supabase project URL before deployment.
SUPABASE_URL = ""

[[durable_objects.bindings]]
name = "GAME_ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

# Configure credentials through the Cloudflare secret manager.
# This worker is a starting point, not a completed production deployment.

# After creating a Hyperdrive configuration for your Neon database, uncomment
# the binding below and replace the placeholder with its real configuration ID.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "YOUR_HYPERDRIVE_CONFIG_ID"
